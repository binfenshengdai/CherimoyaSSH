name: 打包构建
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm install

      - name: 构建 Tauri 应用 (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: 生成更新清单 (Windows)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          EXE=$(find "$BUNDLE" -name "*_x64-setup.exe" | head -1)
          node scripts/generate-updater-manifest.mjs \
            --os windows \
            --version "$VERSION" \
            --release-url "https://github.com/binfenshengdai/CherimoyaSSH/releases/download/${GITHUB_REF_NAME}" \
            --installer-name "$(basename "$EXE")" \
            --sig "${EXE}.sig" \
            --out latest-windows.json

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis*/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.sig
            latest-windows.json

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm install

      - name: 添加 x86_64 macOS 编译目标
        run: rustup target add x86_64-apple-darwin

      - name: 构建 Tauri 应用 (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target universal-apple-darwin

      - name: 重命名 .app.tar.gz 为通用压缩包
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          cp cherimoya-ssh.app.tar.gz ../cherimoya-ssh_macos.tar.gz

      - name: 生成更新清单 (macOS)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="src-tauri/target/universal-apple-darwin/release/bundle/macos/cherimoya-ssh.app.tar.gz"
          node scripts/generate-updater-manifest.mjs \
            --os darwin \
            --version "$VERSION" \
            --release-url "https://github.com/binfenshengdai/CherimoyaSSH/releases/download/${GITHUB_REF_NAME}" \
            --installer-name "cherimoya-ssh.app.tar.gz" \
            --sig "${TARBALL}.sig" \
            --out latest-darwin.json

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/cherimoya-ssh_macos.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/cherimoya-ssh.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
            latest-darwin.json